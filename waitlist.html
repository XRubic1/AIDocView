<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/credyx-logo-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Credyx A/R Solutions — your back office in one portal. Join the waitlist for trucking carriers."
    />
    <title>Credyx — Join the waitlist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@300;400;500&family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <style>
        #boot-splash {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #f8fafc;
          font-family: 'Barlow Condensed', 'Segoe UI', sans-serif;
        }
        #boot-splash .boot-wordmark {
          font-size: 1.5rem;
          font-weight: 600;
          color: #0f172a;
          letter-spacing: -0.02em;
          margin-bottom: 1.5rem;
        }
        #boot-splash .boot-wordmark span {
          color: #1684fe;
        }
        #boot-splash .boot-spinner {
          width: 2rem;
          height: 2rem;
          border: 3px solid #e2e8f0;
          border-top-color: #1684fe;
          border-radius: 50%;
          animation: boot-spin 0.8s linear infinite;
        }
        #boot-splash .boot-message {
          margin-top: 1rem;
          font-size: 0.875rem;
          color: #64748b;
          font-family: 'Segoe UI', sans-serif;
        }
        @keyframes boot-spin {
          to {
            transform: rotate(360deg);
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #boot-splash .boot-spinner {
            animation: none;
            border-top-color: #1684fe;
          }
        }
      </style>
      <div id="boot-splash" role="status" aria-live="polite" aria-busy="true">
        <div class="boot-wordmark">Cred<span>yx</span></div>
        <div class="boot-spinner" aria-hidden="true"></div>
        <p class="boot-message">Loading…</p>
      </div>
    </div>
    <script type="module" src="/src/main.waitlist.tsx"></script>
  </body>
</html>
